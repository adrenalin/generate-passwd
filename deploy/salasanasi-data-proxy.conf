# Yhteinen putkitus julkisten vuotoaineistojen välityspalvelulle (/data/…).
# Asennetaan /etc/nginx/snippets/salasanasi-data-proxy.conf.
# SPDX-License-Identifier: LGPL-3.0-or-later
#
# /tietovuodot näyttää kahden ulkopuolisen palvelun julkista aineistoa: Have I Been
# Pwnedin vuotoluettelon ja XposedOrNotin tilastoluvut. Kumpaakaan ei haeta
# selaimesta vaan tämän palvelimen kautta, ja se on tarkoituksellinen ero
# /vuodot-sivuun:
#
#   * /vuodot kysyy KÄYTTÄJÄSTÄ (osoite, salasanan tiiviste). Silloin kysely tehdään
#     selaimesta suoraan, jottei tieto voi päätyä meidän lokeihimme.
#   * /tietovuodot kysyy JULKISTA LUETTELOA, joka on kaikille sama. Silloin proxy on
#     parempi: kävijän IP-osoite ei päädy kummallekaan palvelulle, sivun CSP pysyy
#     connect-src 'self' -tiukkuudessa, ja koko sivusto kuormittaa lähdettä yhdellä
#     haulla kuudessa tunnissa tuhannen sijaan.
#
# Siksi tässä EI ole X-Forwarded-For- eikä X-Real-IP-otsaketta, toisin kuin
# mittausproxyssa: kävijän osoitetta ei ole tarkoitus välittää eteenpäin. Pyyntö on
# koko sivuston yhteinen, ei kävijän oma.
proxy_set_header User-Agent   "salasanasi.fi (+https://www.salasanasi.fi/tietovuodot)";
proxy_set_header Accept       "application/json";
proxy_set_header Accept-Encoding "";
proxy_set_header Cookie       "";
proxy_set_header Referer      "";

# Keepalive upstreamiin vaatii HTTP/1.1:n ja tyhjennetyn Connection-otsakkeen.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Hyppy kulkee julkisen verkon yli, joten upstreamin varmenne varmennetaan oikeasti.
# SNI on pakollinen: molemmat päät ovat jaetun kuormanjakajan takana.
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Aineisto on reilun megatavun JSON, joten puskurit ovat oletusta isommat. Loppu
# valuu joka tapauksessa välimuistitiedostoon.
proxy_buffer_size       16k;
proxy_buffers         16 32k;
proxy_busy_buffers_size 64k;

proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    20s;

# Välimuisti on tässä koko idea. Kuusi tuntia on vuotoluettelolle tuore — uusi vuoto
# kirjataan lähteeseen päivien viiveellä — ja se pitää lähtevät pyynnöt neljässä
# vuorokaudessa. stale-asetukset tarkoittavat, että lähteen katko tai kyselyraja
# näkyy kävijälle vanhana luettelona eikä virheenä, ja background_update hakee uuden
# taustalla vastaamatta hitaammin.
proxy_cache sp_breaches;
proxy_cache_valid 200 6h;
proxy_cache_valid 404 429 500 502 503 504 1m;
proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 20s;

# Lähteet ovat Cloudflaren takana ja lähettävät omia otsakkeitaan: evästeitä,
# CORS-otsakkeita ja raportointiosoitteita. Mikään niistä ei kuulu tähän originiin.
proxy_hide_header Set-Cookie;
proxy_ignore_headers Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Report-To;
proxy_hide_header NEL;
proxy_hide_header Alt-Svc;
proxy_hide_header Server;
proxy_hide_header CF-Ray;
proxy_hide_header CF-Cache-Status;

# ⚠️ Turvaotsakkeet nimenomaan: lähde lähettää omansa, ja ilman tätä vastauksessa
# olisi kaksi Strict-Transport-Securityä. Selain lukee niistä ensimmäisen, eli
# lähteen — ja HIBP:n otsake on "includeSubDomains; preload", mikä ei ole tämän
# sivuston valinta eikä sen pidä tulla tänne kolmannelta osapuolelta. Sama koskee
# muita politiikkaotsakkeita: tälle originille ne asetetaan yhdessä paikassa,
# snippets/salasanasi-headers.conf:issa.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Permissions-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;

# Välimuistin ikä päätetään täällä, ei lähteessä. expires eikä add_header, jotta
# server-tason turvaotsakkeet periytyvät tänne.
proxy_ignore_headers Cache-Control Expires;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
expires 1h;

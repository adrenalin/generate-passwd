# Yhteinen putkitus Matomon kahdelle keräyspäätepisteelle.
# Asennetaan /etc/nginx/snippets/salasanasi-matomo-proxy.conf.
# SPDX-License-Identifier: LGPL-3.0-or-later
#
# Host on kiinnitetty upstreamin omaan nimeen eikä $host-muuttujaan: openmatin
# Matomossa on trusted_hosts[] = "www.openmat.fi" ja se hylkää muulla nimellä
# saapuvan pyynnön, joten oman host-otsakkeen välittäminen katkaisisi mittauksen.
proxy_set_header Host              www.openmat.fi;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Accept-Encoding   "";

# Keepalive upstreamiin vaatii HTTP/1.1:n ja tyhjennetyn Connection-otsakkeen, muuten
# jokainen majakka maksaa uuden TLS-kättelyn julkisen verkon yli.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Tämä hyppy kulkee julkisen verkon yli, joten upstreamin varmenne varmennetaan
# oikeasti — SNI mukaan lukien, koska openmat.fi:n nginx valitsee vhostin sen perusteella.
proxy_ssl_server_name on;
proxy_ssl_name www.openmat.fi;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Matomon vastauksissa on useita otsakkeita; oletuspuskurit ovat niille liian pienet.
proxy_buffer_size       16k;
proxy_buffers         8 16k;
proxy_busy_buffers_size 32k;

# Seurantaskripti ei saa koskaan asettaa evästettä tähän originiin. Mittaus on
# määritetty evästeettömäksi (disableCookies analytics.js:ssä) ja tämä on sen varmistus:
# se tarkoittaa, ettei evästekyselyä tarvita, eikä väite riipu etäjärjestelmän
# asetusten pysymisestä ennallaan.
proxy_hide_header Set-Cookie;
proxy_ignore_headers Set-Cookie;

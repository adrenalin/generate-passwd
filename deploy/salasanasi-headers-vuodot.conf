# Turvaotsakkeet vuototarkistussivulle. Asennetaan
# /etc/nginx/snippets/salasanasi-headers-vuodot.conf.
# SPDX-License-Identifier: LGPL-3.0-or-later
#
# Sama kuin salasanasi-headers.conf yhtä poikkeusta lukuun ottamatta: /vuodot on
# koko sivuston ainoa sivu, jolta selain ottaa yhteyden ulkopuolelle. connect-src
# on siksi avattu täsmälleen kahdelle osoitteelle, eikä millekään muulle:
#
#   api.xposedornot.com  — sähköpostiosoitteen vuotohaku
#   api.pwnedpasswords.com — salasanan k-anonymiteettihaku (viisi merkkiä tiivisteestä)
#
# Muut direktiivit pysyvät entisellään: skriptit, tyylit, kuvat ja kirjasimet
# tulevat yhä vain tästä originista, joten kolmas osapuoli ei voi ajaa sivulla
# koodia eikä pudottaa siihen jäljityskuvaa. Vuotoluettelon logot jätettiin
# tarkoituksella näyttämättä, jotta img-src ei tarvitse aukkoa.
#
# ⚠️ Nämä on toistettava kokonaan: nginx perii add_headerit ulommalta tasolta vain
# jos nykyinen taso ei määrittele yhtään omaa.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.xposedornot.com https://api.pwnedpasswords.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

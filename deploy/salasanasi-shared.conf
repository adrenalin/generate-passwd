# http-tason määrittelyt salasanasi.fi:lle. Asennetaan /etc/nginx/conf.d/-hakemistoon,
# jotta ne latautuvat ennen vhostia (nginx.conf lukee conf.d/*.conf ennen sites-enabled/*)
# ja jotta vhostin voi poistaa käytöstä ilman roikkuvia viittauksia.
# SPDX-License-Identifier: LGPL-3.0-or-later
#
# Tällä palvelimella on parikymmentä muuta sivustoa, ja vyöhykkeen tai upstreamin nimi on
# koko nginx-konfiguraation laajuinen. Siksi kaikki nimet alkavat sp_ — törmäys olisi
# `nginx -t` -virhe eli katkos jokaiselle koneen sivustolle.

# ── Matomo, jonne mittausproxy osoittaa ──────────────────────────────
# Matomo on openmat.fi:n takana. Selain ei ota siihen suoraa yhteyttä missään
# vaiheessa; tämä on palvelimelta palvelimelle kulkeva hyppy. Nimi selvitetään kerran
# käynnistyksessä, joten DNS-muutos vaatii uudelleenlatauksen — se on turvallinen
# epäonnistumistapa, koska nginx pitää viimeisen toimivan osoitteen.
upstream sp_matomo {
	server www.openmat.fi:443;
	keepalive 4;
}

# matomo.js on iso ja muuttuu vain Matomon päivityksissä. Välimuisti tarkoittaa yhtä
# hakua viikossa kävijää kohden sijaan, ja stale-asetuksen kanssa mittaus kestää myös
# openmat.fi:n katkon yli.
proxy_cache_path /var/cache/nginx/sp-matomo levels=1:2 keys_zone=sp_matomo:1m
                 max_size=32m inactive=7d use_temp_path=off;

# Mittauspäätepisteet ovat julkisia, joten niille oma kattonsa.
limit_req_zone $binary_remote_addr zone=sp_stats:10m rate=30r/m;

# ── Julkiset vuotoaineistot, joita /tietovuodot näyttää ──────────────
# Have I Been Pwnedin vuotoluettelo ja XposedOrNotin tilastoluvut. Molemmat ovat
# julkista aineistoa eivätkä sisällä mitään kävijästä, joten ne haetaan kerran koko
# sivuston puolesta eikä jokaisesta selaimesta erikseen. Selain ei siis ota yhteyttä
# kumpaankaan palveluun, ks. snippets/salasanasi-data-proxy.conf.
#
# Nimi selvitetään kerran käynnistyksessä. Molemmat ovat Cloudflaren anycast-osoitteiden
# takana, joten osoite on käytännössä pysyvä; nginx pitää joka tapauksessa viimeisen
# toimivan, eli DNS-muutos vaatii uudelleenlatauksen.
upstream sp_hibp {
	server haveibeenpwned.com:443;
	keepalive 2;
}

upstream sp_xon {
	server api.xposedornot.com:443;
	keepalive 2;
}

# Vuotoluettelo on reilun megatavun JSON, tilastoluvut muutaman kilotavun. Kuuden
# tunnin välimuisti tarkoittaa neljää hakua vuorokaudessa riippumatta kävijämäärästä.
proxy_cache_path /var/cache/nginx/sp-breaches levels=1:2 keys_zone=sp_breaches:1m
                 max_size=64m inactive=24h use_temp_path=off;

# Aineistopäätepisteet ovat julkisia, joten niille oma kattonsa. Yksi sivulataus on
# yksi tai kaksi pyyntöä, joten tämä ei osu tavalliseen käyttöön.
limit_req_zone $binary_remote_addr zone=sp_data:10m rate=60r/m;

# ── Anonymisoitu lokitus ─────────────────────────────────────────────
# Tietosuojaseloste lupaa, ettei tarkkaa IP-osoitetta säilytetä missään. Se koskee myös
# verkkopalvelimen lokia, joten osoite typistetään jo ennen kirjoittamista: IPv4:stä
# jäävät kaksi ensimmäistä tavua, IPv6:sta /64-etuliite. Tuntematon muoto putoaa
# defaultiin, eli anonymisoituu kokonaan.
map $remote_addr $sp_anon_ip {
	default                                                              "0.0.0.0";
	~^(?<sp_v4>[0-9]+\.[0-9]+)\.                                         "$sp_v4.0.0";
	~^(?<sp_v6>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):     "$sp_v6::";
}

log_format sp_anon '$sp_anon_ip - - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

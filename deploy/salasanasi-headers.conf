# Turvaotsakkeet. Asennetaan /etc/nginx/snippets/salasanasi-headers.conf.
# SPDX-License-Identifier: LGPL-3.0-or-later
#
# ⚠️ nginx perii add_headerit ulommalta tasolta VAIN jos nykyinen taso ei määrittele
# yhtään omaa. Siksi jokainen location, joka lisää oman otsakkeensa, sisällyttää
# tämän uudelleen — muuten se menettäisi kaikki alla olevat.

# Kaikki tapahtuu selaimessa: sivu ei tarvitse yhtään ulkopuolista resurssia.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
